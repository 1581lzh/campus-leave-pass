# /etc/nginx/conf.d/leave.lolpk.icu.conf
#
# 校园请假通行系统 nginx 反代样例（未在当前机器安装或 reload）。
# 安装前请确认证书覆盖 leave.lolpk.icu、DNS 解析与 Cloudflare 代理模式。
#
# 应用仅监听 127.0.0.1:8080，由本 server block 终止 TLS。
# 复用现有 Cloudflare Origin 证书时，把下面两行 ssl_certificate 路径
# 换成实际文件；不要照抄示例文件名，部署前用 openssl x509 -noout -text
# 确认证书 SAN 覆盖 leave.lolpk.icu。

# 可选：Cloudflare 橙云（代理开启）时必须启用真实 IP 恢复。
# 本块默认注释；若启用，需要填入 Cloudflare 官方 IP 段
# （https://www.cloudflare.com/ips/），并保留 real_ip_header。
# 不启用时请把该域名的 DNS 改为 DNS-only（灰云）直接回源。
#
# http {
#     real_ip_header CF-Connecting-IP;
#     set_real_ip_from 173.245.48.0/20;
#     set_real_ip_from 103.21.244.0/22;
#     set_real_ip_from 103.22.200.0/22;
#     set_real_ip_from 103.31.4.0/22;
#     set_real_ip_from 141.101.64.0/18;
#     set_real_ip_from 108.162.192.0/18;
#     set_real_ip_from 190.93.240.0/20;
#     set_real_ip_from 188.114.96.0/20;
#     set_real_ip_from 197.234.240.0/22;
#     set_real_ip_from 198.41.128.0/17;
#     set_real_ip_from 162.158.0.0/15;
#     set_real_ip_from 104.16.0.0/13;
#     set_real_ip_from 104.24.0.0/14;
#     set_real_ip_from 172.64.0.0/13;
#     set_real_ip_from 131.0.72.0/22;
#     set_real_ip_from 2400:cb00::/32;
#     set_real_ip_from 2606:4700::/32;
#     set_real_ip_from 2803:f800::/32;
#     set_real_ip_from 2405:b500::/32;
#     set_real_ip_from 2405:8100::/32;
#     set_real_ip_from 2a06:98c0::/29;
#     set_real_ip_from 2c0f:f248::/32;
# }

server {
    listen 80;
    listen [::]:80;
    server_name leave.lolpk.icu;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name leave.lolpk.icu;

    # TODO: 替换为实际证书路径（复用覆盖该子域的 Cloudflare Origin 证书）。
    # 以下仅为占位符，不能直接用于生产。
    ssl_certificate     /etc/nginx/ssl/CHANGE_ME_ORIGIN_CERT.pem;
    ssl_certificate_key /etc/nginx/ssl/CHANGE_ME_ORIGIN_KEY.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # 默认请求体上限 1MB；学生导入路由单独放宽（见下）。
    client_max_body_size 1m;

    # 公共反代头。应用只信任 nginx 覆盖写入的 X-Real-IP。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # 学生导入：/t/classes/{id}/students/import
    # 应用层仍限制 5MB 与仅 .xlsx，这里只是让请求到达应用。
    location ~ ^/t/classes/[^/]+/students/import$ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:8080;
    }

    # 门卫页与代理审批页含一次性 token：关闭 access log，避免 token 落盘。
    location /p/ {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
    }

    location /a/ {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
    }

    # 内嵌静态资源（app.css / app.js）经应用直接反代，保持配置简单。
    # 若后续需要 nginx 级缓存，可加 proxy_cache 或改为 root 指向导出目录。
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
    # Reset tokens travel in the query string; keep them out of access logs.
    location = /reset-password {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
    }

}
