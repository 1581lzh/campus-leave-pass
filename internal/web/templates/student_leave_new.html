{{define "content"}}
<section class="page-head"><div><p class="eyebrow">学生</p><h1>新建请假</h1><p class="muted">{{.Student.Name}} · {{.Class.Name}}{{if .Student.Dorm}} · {{.Student.Dorm}}{{end}}</p></div></section>
{{if .Error}}<div class="alert alert-error" role="alert">{{.Error}}</div>{{end}}
{{if not .CanSubmit}}<div class="alert alert-warn">{{.SubmitReason}}</div>{{end}}
<div class="card narrow-card">
  {{if .CanSubmit}}
  <form method="post" action="/s/leave/new" class="stack">
    {{template "csrf" .}}
    <label class="field"><span>联系电话</span><input name="contact_phone" value="{{.ContactPhone}}" inputmode="tel" autocomplete="tel"><small>可选，5–20 位数字、+、- 或空格。</small></label>
    <label class="field"><span>请假开始时间</span><input type="datetime-local" name="start_at" value="{{.Start}}" required></label>
    <label class="field"><span>请假结束时间</span><input type="datetime-local" name="end_at" value="{{.End}}" required><small>最长 30 天；最多可回填 5 分钟。</small></label>
    <label class="field"><span>请假原因</span><textarea name="reason" rows="5" required>{{.Reason}}</textarea></label>
    <div class="actions">
      <button class="btn btn-primary" type="submit">提交请假</button>
      <a class="btn" href="/s">取消</a>
    </div>
  </form>
  {{else}}
  <p class="lead">{{.SubmitReason}}</p>
  <div class="actions"><span class="btn btn-primary" aria-disabled="true" data-reason="{{.SubmitReason}}" tabindex="0">提交请假</span><a class="btn" href="/s">返回首页</a></div>
  {{end}}
</div>
{{end}}
