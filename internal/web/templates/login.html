{{define "content"}}
<section class="auth-wrap">
  <div class="card auth-card">
    <h1>{{if eq .Mode "staff"}}教职工登录{{else if eq .Mode "admin"}}管理员登录{{else}}学生登录{{end}}</h1>
    {{if .Error}}<div class="alert alert-error" role="alert">{{.Error}}</div>{{end}}
    <form method="post" action="{{if eq .Mode "staff"}}/staff/login{{else if eq .Mode "admin"}}/admin/login{{else}}/login{{end}}" class="stack">
      {{template "csrf" .}}
      <label class="field">
        <span>{{if eq .Mode "student"}}学号{{else}}用户名或手机号{{end}}</span>
        <input name="ident" value="{{.Ident}}" autocomplete="username" required autofocus>
      </label>
      <label class="field">
        <span>密码</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary btn-block" type="submit">登录</button>
    </form>
    <div class="auth-links">
      {{if eq .Mode "student"}}
        <a href="/forgot-password">忘记密码</a>
        <a href="/staff/login">教职工登录</a>
        <a href="/register">如何获得账号？</a>
      {{else if eq .Mode "staff"}}
        <a href="/forgot-password">忘记密码</a>
        <a href="/staff/register">使用注册码注册</a>
        <a href="/login">学生登录</a>
      {{else}}
        <a href="/admin/forgot-password">管理员忘记密码</a>
        <a href="/staff/login">教职工登录</a>
      {{end}}
    </div>
  </div>
</section>
{{end}}
